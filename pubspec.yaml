name: bogor_kerja
description: "Aplikasi cari lowongan kerja Bogor Kerja - native Flutter"
publish_to: 'none'
version: 1.0.0+4

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # Networking
  dio: ^5.5.0+1
  pretty_dio_logger: ^1.4.0
  connectivity_plus: ^6.0.5

  # Routing
  go_router: ^14.2.7

  # Local storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.2

  # Image caching
  cached_network_image: ^3.4.1

  # Push notification
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1

  # UI helpers
  shimmer: ^3.0.0
  flutter_html: ^3.0.0-beta.2
  url_launcher: ^6.3.1
  share_plus: 11.1.0
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.10+1
  lottie: ^3.1.3
  intl: ^0.19.0
  uuid: ^4.5.1
  package_info_plus: ^8.1.1
  device_info_plus: ^11.1.1
  flutter_slidable: ^3.1.2
  smooth_page_indicator: ^1.2.0+3

  cupertino_icons: ^1.0.8
  firebase_analytics: ^11.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

# Konfigurasi flutter_launcher_icons — jalankan setelah `flutter pub get`:
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFEEAB"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 23

# Konfigurasi flutter_native_splash — jalankan setelah `flutter pub get`:
#   dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0C3B4D"
  image: "assets/icon/splash_logo.png"
  color_dark: "#0E1116"
  image_dark: "assets/icon/splash_logo.png"
  android_12:
    color: "#0C3B4D"
    image: "assets/icon/splash_logo.png"
    color_dark: "#0E1116"
    image_dark: "assets/icon/splash_logo.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/
